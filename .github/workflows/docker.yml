name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lion1991/xrayr

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      # Read-only deploy key for the private wkernel repository; the Dockerfile
      # reaches it through the forwarded agent (`ssh: default` below). Loaded right
      # before the build and dropped after it, so no other step can use it.
      - name: Load wkernel deploy key
        env:
          WKERNEL_DEPLOY_KEY: ${{ secrets.WKERNEL_DEPLOY_KEY }}
        run: |
          sock="$RUNNER_TEMP/ssh-agent.sock"
          eval "$(ssh-agent -a "$sock")" > /dev/null
          echo "$WKERNEL_DEPLOY_KEY" | ssh-add -
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          ssh: default
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Stop ssh agent
        if: always() && env.SSH_AGENT_PID != ''
        run: ssh-agent -k
